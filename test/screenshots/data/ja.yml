# The demo data of the Japanese screenshots (test/screenshots/screens.rb):
# what a Japanese team's Redmine shows, the same names as the demo data of
# redmine-guide's screenshots (screenshots/data/ja.yml there), so that the
# screens and the guide's images match. Trackers, issue statuses,
# priorities, activities, document categories and roles are named as Redmine
# 7.0.3's default data for Japanese (config/locales/ja.yml, default_*); the
# rest is translated, and the users' names are fictional. Identifiers
# (logins, project identifiers, version numbers, email addresses) stay as
# they are. English keeps Redmine's test data.

# Records of Redmine's test fixtures, by model and id.
records:
  Tracker:
    1: { name: バグ, description: 不具合の報告 }
    2: { name: 機能, description: 新しい機能の要望 }
    3: { name: サポート }
  IssueStatus:
    1: { name: 新規 }
    2: { name: 進行中 }
    3: { name: 解決 }
    4: { name: フィードバック }
    5: { name: 終了 }
